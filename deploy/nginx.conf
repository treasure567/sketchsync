map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

# Behind Caddy the browser's scheme arrives in X-Forwarded-Proto; keep it so
# the server marks session cookies Secure on HTTPS.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 60m;

  # Docker's DNS. Resolving per request (via the variable below) means a
  # restarted server container with a new IP is picked up without reloading.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $sync_server http://server:3002;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  location /socket.io/ {
    proxy_pass $sync_server;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /api/ {
    proxy_pass $sync_server;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~ ^/(index\.html|sw\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
