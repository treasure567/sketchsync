name: sketchsync

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy

  server:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sketchsync:${POSTGRES_PASSWORD:-sketchsync}@postgres:5432/sketchsync
      REDIS_URL: redis://redis:6379
    # a range so `--scale server=N` works; the first instance gets 3002
    ports:
      - "127.0.0.1:${SERVER_PORTS:-3002-3011}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sketchsync
      POSTGRES_USER: sketchsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sketchsync}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sketchsync -d sketchsync"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
